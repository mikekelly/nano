services:
  nano:
    build: .
    image: nano
    container_name: nano
    restart: unless-stopped # brings the node back after System.halt()
    init: true # reaps orphaned OS processes (epmd's launcher, anything agents leave behind)
    ports:
      - "127.0.0.1:4000:4000" # no authentication and /api/eval runs code: localhost only
    volumes:
      # A dedicated clone of this repo, never this working copy: agents can rewrite it.
      - ${NANO_CHECKOUT:-../nano-checkout}:/app
      - ./data:/data # JSONL logs in ./data/logs, agents' saved state in ./data/state
    environment:
      - OPENROUTER_API_KEY
      - DEFAULT_MODEL=${DEFAULT_MODEL:-deepseek/deepseek-v4.1-flash}
      - NODE_COOKIE
      - REASONING
      - SYSTEM_PROMPT_FILE
      - STATE_DIR
      - AGENT_MAX_TURNS
      - AGENT_MAX_TOKENS
      - AGENT_MAX_CONTEXT
      - NODE_MAX_TOKENS_PER_HOUR
      - EVAL_TIMEOUT_MS
      - RESULT_MAX_BYTES
      - OPENROUTER_BASE_URL
      # Shown to agents in their system prompt, so it must be true. This file does not
      # restrict egress; if you do (see README), set NETWORK_POLICY to text that matches.
      - NETWORK_POLICY=${NETWORK_POLICY:-unrestricted outbound internet access}
